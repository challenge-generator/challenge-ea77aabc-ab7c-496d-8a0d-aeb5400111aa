spring:
  application:
    name: payments-system
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: payments_user
    password: payments_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
      pool-name: payments-pool
      auto-commit: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false
    schemas: public
    table: flyway_schema_history
  transaction:
    default-timeout: 5
    rollback-on-commit-failure: true

server:
  port: 8080
  servlet:
    context-path: /api/v1
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    ratelimiters:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5000
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
        recordExceptions:
          - org.springframework.transaction.TransactionSystemException
          - java.util.concurrent.TimeoutException
          - org.springframework.dao.DataAccessResourceFailureException
    instances:
      fraudDetection:
        baseConfig: default
        failureRateThreshold: 60
        waitDurationInOpenState: 10000
      coreBanking:
        baseConfig: default
        failureRateThreshold: 70
        waitDurationInOpenState: 15000
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500
        retryExceptions:
          - java.util.concurrent.TimeoutException
          - org.springframework.transaction.TransactionTimeoutException
    instances:
      fraudDetection:
        baseConfig: default
      coreBanking:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 2s
    instances:
      fraudDetection:
        timeoutDuration: 1500ms
      coreBanking:
        timeoutDuration: 3000ms

app:
  default-currency: COP
  transaction:
    idempotency:
      enabled: true
      cache-ttl: 3600
      cache-size: 10000
    validation:
      min-amount: 100
      max-amount: 10000000
      allowed-channels:
        - MOBILE
        - WEB
        - POS
        - ATM
  circuit-breaker:
    failure-rate-threshold: 50
    wait-duration-in-open-state: 5000
    sliding-window-size: 10
  retry:
    max-attempts: 3
    wait-duration: 500
  timeout:
    transaction-timeout: 5000